<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="header">
    <img src="icons/icon48.png" width="24" height="24" alt="logo">
    <h3>Hidden channels (0)</h3>
    <div class="header-actions">
      <button id="toggleAddButton" title="Add channel">+</button>
      <button id="clearAllButton" title="Remove all">🗑</button>
    </div>
  </div>

  <input type="text" id="channelInput" placeholder="Channel name" style="display: none;">
  <button id="addButton" style="display: none;">Hide</button>

  <input type="text" id="searchInput" placeholder="Search hidden channels...">

  <ul id="channelsList"></ul>

  <script src="popup.js"></script>
</body>
</html>
